; ============================================
;  站点配置
; ============================================
[site]
name        = Nimbulux_
locale      = zh_CN
lang        = zh-CN
description = Nimbulux_ 的 文档库文章
home_label  = 首页

; 站点根地址（用于 canonical / og:url），末尾不要带 /
base_url    = https://nimbulux.github.io

; 站点在域名下的路径前缀，末尾不要带 /
root_path   = /pages

; 只保留这一项资源引用
favicon     = /resources/favicon.jpg

; ============================================
;  路径（相对于本脚本所在目录）
; ============================================
[paths]
posts = ../posts
pages = ../pages

[build]
; true 表示构建前清空 pages 目录
clean = true